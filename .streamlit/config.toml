# Umbral · modo instrumento (dashboards live in dark mode).
# Hexes mirror assets/tokens.json → mode.instrumento; config.toml cannot
# read JSON, so keep these in sync with the tokens by hand.
# Generado por umbral-style-guide v1.1.0: tokens/build/streamlit-config.toml

[theme]
base = "dark"
primaryColor = "#5FD4C4"            # signal
backgroundColor = "#101418"         # base
secondaryBackgroundColor = "#171C22" # panel
textColor = "#EDF1F4"               # ink
# "sans serif" es un valor VÁLIDO de Streamlit que significa su propia Source
# Sans — no una errata. Hay que nombrar la familia (UMB-TYP-002).
font = "IBM Plex Sans, sans-serif"

[server]
# Sirve static/ para auto-hospedar las fuentes (UMB-TYP-005).
enableStaticServing = true

[browser]
gatherUsageStats = false
